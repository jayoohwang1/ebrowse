[project]
name = "ebrowse"
version = "0.1.0"
description = "Token-efficient browser control CLI for AI agents: sectioned page outlines, durable element refs, diff-based action results."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jayoo Hwang" }]
dependencies = [
    "playwright>=1.52",
    "httpx>=0.27",
    "loguru>=0.7",
]

[project.scripts]
ebrowse = "ebrowse.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ebrowse"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "browser: needs a real headless browser (deselect with '-m \"not browser\"')",
    "e2e: full CLI-to-daemon tests (deselect with '-m \"not e2e\"')",
    "live: needs the local summarizer LLM server running",
]
