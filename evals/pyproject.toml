[project]
name = "ebrowse-evals"
version = "0.1.0"
description = "Evaluation harness for ebrowse: run agents on browsing tasks, capture rich traces, inspect them."
requires-python = ">=3.11"
dependencies = [
    "ebrowse",
]

[project.scripts]
ebrowse-eval = "ebrowse_evals.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ebrowse_evals"]

[tool.uv.sources]
ebrowse = { workspace = true }
