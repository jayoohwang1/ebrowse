<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Consent Veil — Fixture</title>
  <style>
    body { margin: 0; font-family: sans-serif; }
    header { background: #333; color: #fff; padding: 12px 24px; }
    header a { color: #fff; margin-right: 12px; }
    main { max-width: 560px; margin: 0 auto; padding: 24px; }
    /* full-viewport childless clickable overlay: only a text node inside */
    #consent-veil { position: fixed; inset: 0; z-index: 100; cursor: pointer;
                    background: rgba(20, 20, 20, .55); color: #fff;
                    padding: 40vh 40px 0; text-align: center; font-size: 18px; }
  </style>
</head>
<body>
  <header>
    <a href="/">Fixture Shop</a>
    <nav aria-label="Main"><a href="/list.html">Products</a> <a href="/help.html">Help</a></nav>
  </header>

  <main>
    <h1>Weekly newsletter</h1>
    <p><button type="button" id="subscribe">Subscribe</button></p>
    <p id="result">Not subscribed.</p>
  </main>

  <div id="consent-veil" onclick="this.remove()">We value your privacy — click anywhere to dismiss</div>

  <script>
    document.getElementById('subscribe').addEventListener('click', () => {
      document.getElementById('result').textContent = 'Subscribed!';
    });
  </script>
</body>
</html>
